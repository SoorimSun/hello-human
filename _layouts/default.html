<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 사내 동호회 사이트: 검색엔진 수집·노출·캐시 차단. 지우지 마세요. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
<meta property="og:image" content="https://soorimsun.github.io/hello-human/assets/social/hellobot.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="헬로우 휴먼의 마스코트 헬로봇">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://soorimsun.github.io/hello-human/assets/social/hellobot.jpg">
<meta name="twitter:image:alt" content="헬로우 휴먼의 마스코트 헬로봇">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="{{ '/assets/theme.js' | relative_url }}?v=3"></script>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=7">
<link rel="stylesheet" href="{{ '/assets/content-updates.css' | relative_url }}?v=1">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="logo" href="{{ '/' | relative_url }}">hello, human<span class="cursor" aria-hidden="true">_</span></a>
  </div>
</header>

<main class="wrap prose">
{{ content }}
</main>

<footer class="footer">
  <div class="wrap">헬로우 휴먼 · Workless Engineering Club</div>
</footer>

<script src="{{ '/assets/analytics.js' | relative_url }}?v=2" defer></script>
<script type="module" src="{{ '/assets/content-updates.js' | relative_url }}?v=2"></script>
</body>
</html>
